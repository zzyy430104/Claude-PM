# 登录与刷新接口的访问频率限制（按客户端 IP）；应用内还有按账号的失败次数限制
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 30m;   # 略大于 MAX_UPLOAD_MB（默认 25）

  include /etc/nginx/security-headers.inc;

  # 前端与 API 同域：/api 转发到后端并去掉前缀
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /api/auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://api:3000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # 带哈希的静态资源可长期缓存
  location ~* \.(js|css|woff2?|ico)$ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 入口页不缓存，刷新任意前端路由都回到 index.html
  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
